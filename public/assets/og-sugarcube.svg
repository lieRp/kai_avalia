  <g transform="translate(536, 78) scale(2.0)">
    <circle cx="32" cy="34" r="34" fill="#FFFFFF" stroke="#F5B5D0" stroke-width="2"/>
    <path d="M16 36 L48 36 L44 55 C44 57 42 58 40 58 L24 58 C22 58 20 57 20 55 Z" fill="#F4B942" stroke="#2D1622" stroke-width="2" stroke-linejoin="round"/>
    <line x1="25" y1="38" x2="27" y2="56" stroke="#2D1622" stroke-width="1.5" opacity="0.45"/>
    <line x1="32" y1="38" x2="32" y2="56" stroke="#2D1622" stroke-width="1.5" opacity="0.45"/>
    <line x1="39" y1="38" x2="37" y2="56" stroke="#2D1622" stroke-width="1.5" opacity="0.45"/>
    <path d="M10 35 C10 24, 19 18, 32 18 C45 18, 54 24, 54 35 C54 39, 49 41, 45 38 C42 41, 38 41, 35 38 C32 41, 30 41, 27 38 C24 41, 20 41, 17 38 C13 41, 10 39, 10 35 Z" fill="#DE3B7A" stroke="#2D1622" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="32" cy="14" r="5" fill="#FFE066" stroke="#2D1622" stroke-width="2"/>
  </g>

  <!-- Pílula Centralizada -->
  <rect x="430" y="232" width="340" height="42" rx="21" fill="url(#pill)"/>
  <text x="600" y="259" text-anchor="middle" fill="#FFFFFF" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="18.5" font-weight="bold" letter-spacing="1.2">FEIRA DE SANTANA • BAHIA</text>

  <!-- Título e Subtítulos 100% Centralizados -->
  <text x="600" y="338" text-anchor="middle" fill="#2A1420" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="bold">Sugarcube Corner</text>
  <text x="600" y="384" text-anchor="middle" fill="#523243" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="26" font-weight="bold">Guia Autoral de Bolos e Confeitarias • por Kai Tavares</text>
  <text x="600" y="424" text-anchor="middle" fill="#785265" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="21" font-weight="600">Avaliação Sensorial de Textura • Massa • Sabor • Recheio</text>
