<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF8F5"/>
      <stop offset="50%" stop-color="#FFEAF3"/>
      <stop offset="100%" stop-color="#E8F6FD"/>
    </linearGradient>
    <linearGradient id="pill" x1="420" y1="0" x2="780" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C42865"/>
      <stop offset="100%" stop-color="#E84A8A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="42%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fundo Suave Sugarcube Corner -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="600" cy="265" r="360" fill="url(#glow)"/>
  <rect x="44" y="44" width="1112" height="542" rx="34" stroke="#F4BBD3" stroke-width="3.5" stroke-dasharray="10 8" fill="none" opacity="0.85"/>

  <!-- Balões Simétricos nas Laterais -->
  <g opacity="0.22">
    <circle cx="170" cy="175" r="36" fill="#2F96C9"/>
    <circle cx="220" cy="145" r="36" fill="#F4B942"/>
    <circle cx="205" cy="212" r="32" fill="#DE3B7A"/>
    <circle cx="1030" cy="175" r="36" fill="#2F96C9"/>
    <circle cx="980" cy="145" r="36" fill="#F4B942"/>
    <circle cx="995" cy="212" r="32" fill="#DE3B7A"/>
  </g>

